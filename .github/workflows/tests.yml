name: tests

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run mypy src

  offline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: >-
          uv run coverage run -m pytest
          --ignore=tests/hh/test_hh_client.py
          --ignore=tests/be/test_be_client.py
          --ignore=tests/ni/test_ni_client.py
          --ignore=tests/nrw/test_nrw_client.py
          --ignore-glob='tests/uba/test_get_*.py'
        env:
          COVERAGE_FILE: .coverage.offline-${{ matrix.python-version }}
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-offline-${{ matrix.python-version }}
          path: .coverage.offline-*
          include-hidden-files: true

  # Live API tests run once (not per Python version) to stay within the
  # APIs' rate limits.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.15"
      - run: uv sync --locked
      - run: >-
          uv run coverage run -m pytest
          tests/hh/test_hh_client.py
          tests/be/test_be_client.py
          tests/ni/test_ni_client.py
          tests/nrw/test_nrw_client.py
          tests/uba/test_get_*.py
        env:
          COVERAGE_FILE: .coverage.integration
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-integration
          path: .coverage.integration
          include-hidden-files: true
          if-no-files-found: ignore

  # Combines the coverage data of all test jobs into the job summary and, on
  # pushes to develop, publishes the README badge to the coverage-badge
  # branch. Uses only GitHub-owned actions and astral-sh/setup-uv, as the
  # repository's Actions policy blocks most third-party actions.
  coverage:
    needs: [offline, integration]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          merge-multiple: true
      - run: uv sync --locked
      - run: uv run coverage combine
      - run: uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Publish badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          total=$(uv run coverage report --format=total)
          dir="$RUNNER_TEMP/badge"
          mkdir "$dir"
          uv run python .github/scripts/coverage_badge.py "$total" > "$dir/badge.svg"
          cd "$dir"
          git init -q -b coverage-badge
          git add badge.svg
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Update coverage badge (${total}%)"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" coverage-badge
