name: tests

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run mypy src

  offline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: >-
          uv run coverage run -m pytest
          --ignore=tests/hh/test_hh_client.py
          --ignore=tests/be/test_be_client.py
          --ignore-glob='tests/uba/test_get_*.py'
        env:
          COVERAGE_FILE: .coverage.offline-${{ matrix.python-version }}
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-offline-${{ matrix.python-version }}
          path: .coverage.offline-*
          include-hidden-files: true

  # Live API tests run once (not per Python version) to stay within the
  # APIs' rate limits.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.15"
      - run: uv sync --locked
      - run: >-
          uv run coverage run -m pytest
          tests/hh/test_hh_client.py
          tests/be/test_be_client.py
          tests/uba/test_get_*.py
        env:
          COVERAGE_FILE: .coverage.integration
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage-integration
          path: .coverage.integration
          include-hidden-files: true
          if-no-files-found: ignore

  # Combines the coverage data of all test jobs, comments the result on PRs
  # and, on pushes to develop, updates the README badge (stored in the
  # python-coverage-comment-action-data branch).
  coverage:
    needs: [offline, integration]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true
      - uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MERGE_COVERAGE_FILES: true
