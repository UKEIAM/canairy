name: tests

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run mypy src

  offline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: >-
          uv run pytest
          --ignore=tests/hh/test_hh_client.py
          --ignore=tests/be/test_be_client.py
          --ignore-glob='tests/uba/test_get_*.py'

  # Live API tests run once (not per Python version) to stay within the
  # APIs' rate limits.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.15"
      - run: uv sync --locked
      - run: >-
          uv run pytest
          tests/hh/test_hh_client.py
          tests/be/test_be_client.py
          tests/uba/test_get_*.py
