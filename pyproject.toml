[project]
name = "canairy"
version = "0.3.0"
description = "Client for German public air-quality APIs (UBA, Hamburg, Berlin, Niedersachsen and Nordrhein-Westfalen)"
readme = "README.md"
authors = [
    { name = "Michael Blaß", email = "m.blass@uke.de" }
]

classifiers = [
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Framework :: Pydantic :: 2",
    "Framework :: Pytest",
    "Typing :: Typed",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research"
]

requires-python = ">=3.12"
dependencies = [
    "hishel[httpx2]>=2.0",
    "httpx2>=2.16.2",
    "pydantic>=2.14.4",
    "tzdata>=2026.6",
]

[dependency-groups]
dev = [
    "coverage>=7.17.5",
    "ipykernel>=7.4.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
docs = [
    "zensical>=0.1.3",
]

[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"


[project.scripts]
aq-downloader = "canairy.scripts.downloader:main"

[project.urls]
Repository = "https://github.com/UKEIAM/canairy"
Changelog = "https://github.com/UKEIAM/canairy/releases"

[tool.mypy]
plugins = ["pydantic.mypy"]
# Check against the oldest supported Python, not the one running mypy.
python_version = "3.12"

[tool.ruff.lint]
extend-select = ["B"]

[tool.coverage.run]
source = ["canairy"]
branch = true
# Relative paths let CI combine data files from different jobs/runners.
relative_files = true

[tool.coverage.report]
show_missing = true
skip_covered = true
