[project]
name = "canairy"
version = "0.3.0rc1"
description = "Client for German public air-quality APIs (UBA, Hamburger Luftmessnetz)"
readme = "README.md"
authors = [
    { name = "Michael Blaß", email = "m.blass@uke.de" }
]

classifiers = [
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Framework :: Pydantic :: 2",
    "Framework :: Pytest",
    "Typing :: Typed",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research"
]

requires-python = ">=3.11"
dependencies = [
    "hishel>=1.0",
    "httpx-limiter>=0.2.0",
    "httpx>=0.28.1",
    "pydantic>=2.11.3",
    "ratelimit>=2.2.1",
    "tzdata>=2026.5",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "mypy>=1.15.0",
    "pytest>=8.3.5",
    "ruff>=0.11.5",
]

[build-system]
requires = ["setuptools>=79"]
build-backend = "setuptools.build_meta"


[project.scripts]
aq-downloader = "canairy.scripts.downloader:main"

[[tool.mypy.overrides]]
module = "ratelimit"
ignore_missing_imports = true

[tool.mypy]
plugins = ["pydantic.mypy"]

[tool.ruff.lint]
extend-select = ["B"]
